<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Admin Portal — StickyPicky</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: #f2f2f8; margin: 0; padding: 0; }
    .admin-wrapper { display: flex; min-height: 100vh; }
    .admin-sidebar {
      width: 250px;
      background: var(--dk);
      color: #fff;
      padding: 24px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 4px solid var(--pk);
    }
    .sidebar-logo {
      font-family: 'Bangers', cursive;
      font-size: 28px;
      color: var(--yw);
      letter-spacing: 2px;
      margin-bottom: 28px;
      text-align: center;
    }
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .sitem {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .sitem:hover, .sitem.on {
      background: var(--g1);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 60, 172, 0.3);
    }
    .admin-content {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
    }
    .admin-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: #fff;
      padding: 16px 20px;
      border-radius: 16px;
      border: 2px solid #eee;
    }
    .ac { background: #fff; border-radius: 16px; border: 2px solid #eee; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
    .act { font-weight: 900; font-size: 18px; margin-bottom: 14px; color: var(--dk); }
    .dg { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .dc { border-radius: 16px; padding: 18px; text-align: center; border: 2px solid rgba(0,0,0,0.05); }
    .dc.c1 { background: linear-gradient(135deg, #FF3CAC15, #FF3CAC08); }
    .dc.c2 { background: linear-gradient(135deg, #784BA015, #784BA008); }
    .dc.c3 { background: linear-gradient(135deg, #2B86C515, #2B86C508); }
    .dc.c4 { background: linear-gradient(135deg, #FFD93D25, #FFD93D08); }
    .dv { font-family: 'Bangers', cursive; font-size: 32px; color: var(--dk); }
    .dl { font-size: 11px; font-weight: 700; color: #888; }
    .afg { margin-bottom: 14px; }
    .afg label { display: block; font-weight: 800; font-size: 12px; margin-bottom: 4px; color: #444; }
    .afg input, .afg select, .afg textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    .afg input:focus { border-color: var(--pk); }
    .asave { background: var(--g1); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 14px; }
    .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-box { background: #fff; border-radius: 20px; border: 4px solid var(--dk); padding: 36px 28px; width: 100%; max-width: 360px; text-align: center; }

    @media (max-width: 768px) {
      .admin-wrapper { flex-direction: column; }
      .admin-sidebar { width: 100%; border-right: none; border-bottom: 4px solid var(--pk); padding: 16px; }
      .sidebar-menu { flex-direction: row; overflow-x: auto; }
      .sitem { white-space: nowrap; }
    }
  </style>
</head>
<body>

  <!-- ADMIN LOGIN MODAL -->
  <div class="login-overlay" id="ADMIN_LOGIN">
    <div class="login-box">
      <div style="font-size:48px;margin-bottom:8px">🔐</div>
      <div style="font-family:'Bangers',cursive;font-size:30px;letter-spacing:2px;color:var(--dk);margin-bottom:4px">ADMIN LOGIN</div>
      <div style="font-size:12px;color:#888;font-weight:700;margin-bottom:18px">StickyPicky Control Portal</div>
      <input id="APWD" type="password" placeholder="Enter Password" style="width:100%;padding:12px;border:2px solid var(--dk);border-radius:10px;font-size:16px;text-align:center;margin-bottom:12px;outline:none;font-weight:700" onkeydown="if(event.key==='Enter')aLogin()">
      <div id="AERR" style="display:none;color:#e53935;font-weight:800;font-size:12px;margin-bottom:10px">❌ Wrong password!</div>
      <button onclick="aLogin()" style="width:100%;padding:12px;background:var(--g1);color:#fff;border:none;border-radius:50px;font-family:'Bangers',cursive;font-size:20px;letter-spacing:2px;cursor:pointer">LOG IN</button>
    </div>
  </div>

  <!-- ADMIN SIDEBAR LAYOUT -->
  <div class="admin-wrapper" id="ADMIN_WRAPPER" style="display:none">
    <!-- LEFT SIDEBAR MENU -->
    <div class="admin-sidebar">
      <div class="sidebar-logo">⚙️ STICKYPICKY</div>
      <div class="sidebar-menu">
        <button class="sitem on" data-t="dash" onclick="swTab('dash')">📊 Dashboard</button>
        <button class="sitem" data-t="orders" onclick="swTab('orders')">📦 Orders</button>
        <button class="sitem" data-t="prods" onclick="swTab('prods')">🏷 Products</button>
        <button class="sitem" data-t="hero" onclick="swTab('hero')">🖼 Hero Banners</button>
        <button class="sitem" data-t="sets" onclick="swTab('sets')">⚙️ Settings</button>
      </div>
      <div style="margin-top:auto;padding-top:20px">
        <a href="index.html" style="display:block;text-align:center;background:rgba(255,255,255,0.1);color:#fff;padding:10px;border-radius:12px;font-weight:800;font-size:12px;text-decoration:none">🌐 View Storefront</a>
        <button onclick="aLogout()" style="width:100%;margin-top:8px;padding:8px;border-radius:10px;border:1px solid #e53935;background:none;color:#ff6b6b;font-size:12px;font-weight:800;cursor:pointer">🚪 Logout</button>
      </div>
    </div>

    <!-- RIGHT CONTENT AREA -->
    <div class="admin-content">
      <div class="admin-header-bar">
        <div>
          <h2 style="font-family:'Bangers',cursive;font-size:26px;letter-spacing:1px;margin:0" id="SECTION_TITLE">📊 ANALYTICS DASHBOARD</h2>
          <span style="font-size:11px;color:#888;font-weight:700">StickyPicky Control Panel</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <button onclick="aLogout()" style="padding:8px 18px;background:#e53935;color:#fff;border:none;border-radius:20px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 8px rgba(229,57,53,0.3)">🚪 LOGOUT</button>
        </div>
      </div>

      <div id="T_dash" class="asec"></div>
      <div id="T_orders" class="asec" style="display:none"></div>
      <div id="T_prods" class="asec" style="display:none"></div>
      <div id="T_hero" class="asec" style="display:none"></div>
      <div id="T_sets" class="asec" style="display:none"></div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/cart.js"></script>
  <script>
    let ORDERS = [];

    function safeStr(s) {
      return typeof window.escapeHTML === 'function' ? window.escapeHTML(String(s || '')) : String(s || '');
    }

    function checkAdminAuth() {
      const isAuthed = sessionStorage.getItem('sp_admin_authed') === 'true';
      const loginModal = document.getElementById('ADMIN_LOGIN');
      const wrap = document.getElementById('ADMIN_WRAPPER');
      if (isAuthed) {
        if (loginModal) loginModal.style.display = 'none';
        if (wrap) wrap.style.display = 'flex';
        loadAdminData();
      } else {
        if (loginModal) loginModal.style.display = 'flex';
        if (wrap) wrap.style.display = 'none';
      }
    }

    function aLogin() {
      const pwd = localStorage.getItem('sp_pwd') || localStorage.getItem('sv_pwd') || 'stickypicky@admin2025';
      const inputVal = (document.getElementById('APWD')?.value || '').trim();

      if (inputVal && inputVal === pwd) {
        sessionStorage.setItem('sp_admin_authed', 'true');
        document.getElementById('AERR').style.display = 'none';
        checkAdminAuth();
      } else {
        document.getElementById('AERR').style.display = 'block';
        document.getElementById('APWD').value = '';
      }
    }

    function aLogout() {
      sessionStorage.removeItem('sp_admin_authed');
      sessionStorage.removeItem('sv_admin_authed');
      location.reload();
    }

    async function loadAdminData() {
      try {
        const ords = await sbGet('sv_orders', 'order=ts.desc');
        if (ords && ords.length) ORDERS = ords;
      } catch (e) {
        console.warn('Orders load DB warning:', e);
      }
      try {
        const localOrds = JSON.parse(localStorage.getItem('sp_local_orders') || '[]');
        if (localOrds && localOrds.length) {
          const merged = [...ORDERS];
          localOrds.forEach(lo => {
            if (!merged.some(x => x.id === lo.id)) merged.push(lo);
          });
          ORDERS = merged;
        }
      } catch(e) {}
      rDash();
    }

    function swTab(t) {
      document.querySelectorAll('.sitem').forEach(b => b.classList.toggle('on', b.dataset.t === t));
      document.querySelectorAll('.asec').forEach(s => s.style.display = 'none');
      document.getElementById('T_' + t).style.display = 'block';

      const titleMap = {
        dash: '📊 ANALYTICS DASHBOARD',
        orders: '📦 CUSTOMER ORDERS MANAGER',
        prods: '🏷 PRODUCT CATALOGUE MANAGER',
        hero: '🖼 HERO BANNERS MANAGER',
        sets: '⚙️ STORE SETTINGS'
      };
      document.getElementById('SECTION_TITLE').textContent = titleMap[t] || 'ADMIN PANEL';

      if (t === 'dash') rDash();
      else if (t === 'orders') rOrders();
      else if (t === 'prods') rProds();
      else if (t === 'hero') rHero();
      else if (t === 'sets') rSets();
    }

    function rDash() {
      const rev = ORDERS.reduce((s, o) => s + (o.tot || 0), 0);
      const nw = ORDERS.filter(o => o.status === 'New').length;
      const sh = ORDERS.filter(o => o.status === 'Shipped').length;
      const dl = ORDERS.filter(o => o.status === 'Delivered').length;

      document.getElementById('T_dash').innerHTML = `
        <div class="dg">
          <div class="dc c1"><div style="font-size:24px">💰</div><div class="dv">₹${rev}</div><div class="dl">Total Revenue</div></div>
          <div class="dc c2"><div style="font-size:24px">📦</div><div class="dv">${ORDERS.length}</div><div class="dl">Total Orders</div></div>
          <div class="dc c3"><div style="font-size:24px">🆕</div><div class="dv">${nw}</div><div class="dl">New Orders</div></div>
          <div class="dc c4"><div style="font-size:24px">🚚</div><div class="dv">${dl}</div><div class="dl">Delivered</div></div>
        </div>

        <div class="ac">
          <div class="act">🔥 Recent Customer Orders</div>
          ${ORDERS.slice(0, 5).map(o => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee">
              <div>
                <div style="font-weight:900;font-size:14px">#${safeStr(o.id)} — ${safeStr(o.name)} (${safeStr(o.phone)})</div>
                <div style="font-size:12px;color:#888">${safeStr(o.date)} · ${safeStr(o.pay)}</div>
              </div>
              <div style="text-align:right">
                <div style="font-family:'Bangers',cursive;font-size:22px;color:var(--pk)">₹${o.tot}</div>
                <span style="background:var(--yw);color:var(--dk);padding:2px 10px;border-radius:12px;font-size:11px;font-weight:900">${safeStr(o.status)}</span>
              </div>
            </div>
          `).join('') || '<p style="color:#aaa;text-align:center;padding:24px">No orders yet</p>'}
        </div>
      `;
    }

    function rOrders(filter = 'all') {
      const list = filter === 'all' ? ORDERS : ORDERS.filter(o => o.status === filter);
      document.getElementById('T_orders').innerHTML = `
        <div class="ac">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            ${['all', 'New', 'Packed', 'Shipped', 'Delivered', 'Cancelled'].map(st => `
              <button onclick="rOrders('${st}')" style="padding:8px 16px;border-radius:20px;border:2px solid var(--dk);font-weight:800;font-size:12px;cursor:pointer;background:${filter === st ? 'var(--dk)' : '#fff'};color:${filter === st ? '#fff' : 'var(--dk)'}">${st === 'all' ? 'All Orders' : st}</button>
            `).join('')}
          </div>

          ${list.map(o => {
            const cleanPhone = (o.phone || '').replace(/[\s\-\+]/g, '');
            const items = Array.isArray(o.items) ? o.items : [];
            return `
              <div style="background:#f9f9ff;border-radius:14px;padding:16px;margin-bottom:16px;border:2px solid #eee">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
                  <div style="flex:1;min-width:260px">
                    <div style="display:flex;align-items:center;gap:10px">
                      <span style="font-family:'Bangers',cursive;font-size:24px;color:var(--pk)">#${safeStr(o.id)}</span>
                      <span style="background:var(--yw);color:var(--dk);padding:2px 10px;border-radius:12px;font-size:11px;font-weight:900">${safeStr(o.status)}</span>
                    </div>
                    <div style="font-weight:900;font-size:16px;margin-top:4px">${safeStr(o.name)}</div>
                    <div style="font-size:13px;font-weight:800;color:var(--bl);margin-top:2px">
                      📱 Phone: ${safeStr(o.phone)} 
                      ${cleanPhone ? `<a href="https://wa.me/91${cleanPhone}?text=${encodeURIComponent('Hi ' + (o.name||'') + '! Regarding your StickyPicky order #' + (o.id||''))}" target="_blank" style="background:#25D366;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;text-decoration:none;margin-left:6px;font-weight:900">💬 WhatsApp Customer</a>` : ''}
                    </div>
                    <div style="font-size:13px;color:#444;margin-top:4px">📍 <b>Address:</b> ${safeStr(o.addr)}</div>
                    <div style="font-size:12px;color:#888;margin-top:4px">🗓️ ${safeStr(o.date)} · Payment Mode: <b>${safeStr(o.pay)}</b></div>
                  </div>

                  <div style="text-align:right">
                    <div style="font-family:'Bangers',cursive;font-size:30px;color:var(--pk)">₹${o.tot}</div>
                    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:flex-end">
                      ${['New', 'Packed', 'Shipped', 'Delivered', 'Cancelled'].map(st => `
                        <button onclick="updStatus('${safeStr(o.id)}', '${st}')" style="padding:6px 10px;border-radius:10px;border:2px solid var(--dk);font-size:11px;font-weight:900;background:${o.status === st ? 'var(--dk)' : '#fff'};color:${o.status === st ? '#fff' : 'var(--dk)'};cursor:pointer">${st}</button>
                      `).join('')}
                      <button onclick="delOrder('${safeStr(o.id)}')" style="padding:6px 10px;border-radius:10px;border:2px solid #e53935;color:#e53935;font-weight:900;font-size:11px;background:#fff;cursor:pointer">🗑 Del</button>
                    </div>
                  </div>
                </div>

                <!-- ORDERED PRODUCTS LIST WITH IMAGES -->
                <div style="margin-top:14px;padding-top:12px;border-top:1px dashed #ccc">
                  <div style="font-weight:900;font-size:12px;color:var(--dk);margin-bottom:8px">🛍️ ORDERED PRODUCTS (${items.length} items):</div>
                  <div style="display:flex;flex-direction:column;gap:8px">
                    ${items.map(it => `
                      <div style="display:flex;align-items:center;gap:10px;background:#fff;padding:8px 12px;border-radius:10px;border:1px solid #ddd">
                        <img src="${safeStr(it.img || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=120&auto=format&fit=crop&q=80')}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid #ddd" alt="Product">
                        <div style="flex:1">
                          <div style="font-weight:900;font-size:13px;color:var(--dk)">${safeStr(it.nm)}</div>
                          <div style="font-size:12px;color:var(--pk);font-weight:800">Price: ₹${it.pr} × ${it.q} = ₹${it.pr * it.q}</div>
                        </div>
                      </div>
                    `).join('') || '<div style="font-size:12px;color:#aaa">No item details recorded</div>'}
                  </div>
                </div>
              </div>
            `;
          }).join('') || '<p style="color:#aaa;text-align:center;padding:30px">No orders found</p>'}
        </div>
      `;
    }

    async function updStatus(id, st) {
      const o = ORDERS.find(x => x.id === id);
      if (!o) return;
      o.status = st;
      try {
        await sbPatch('sv_orders', 'id=eq.' + encodeURIComponent(id), { status: st });
      } catch (e) { console.error(e); }
      rOrders();
      showToast('✅ Status updated to ' + st);
    }

    async function delOrder(id) {
      if (!confirm('Delete order #' + id + '?')) return;
      ORDERS = ORDERS.filter(x => x.id !== id);
      try {
        await sbDelete('sv_orders', 'id=eq.' + encodeURIComponent(id));
      } catch (e) { console.error(e); }
      rOrders();
      showToast('🗑 Order deleted');
    }

    function rProds() {
      document.getElementById('T_prods').innerHTML = `
        <button onclick="toggleAddProductForm()" style="width:100%;padding:14px;background:var(--g1);color:#fff;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:16px">+ Add New Product</button>

        <div id="ADD_PROD_FORM" style="display:none" class="ac">
          <div class="act">➕ Add New Product</div>
          <div class="afg"><label>Product Name *</label><input id="nNM" type="text" placeholder="e.g. Gojo Satoru Sticker"></div>
          <div class="afg"><label>Description</label><input id="nDS" type="text" placeholder="e.g. Anime die-cut vinyl sticker"></div>
          <div class="afg"><label>Price (₹) *</label><input id="nPR" type="number" placeholder="15"></div>
          <div class="afg">
            <label>Category</label>
            <select id="nCAT">
              <option value="sticker">Sticker</option>
              <option value="poster">Poster</option>
              <option value="polaroid">Polaroid</option>
              <option value="offer">Offer</option>
            </select>
          </div>
          <div class="afg"><label>Badge (HOT / NEW / TREND)</label><input id="nBG" type="text" placeholder="HOT"></div>
          <div class="afg">
            <label>Product Image (Upload File OR Enter URL) *</label>
            <input type="file" id="nFILE" accept="image/*" onchange="handleImageFileSelect(this, 'nIMG', 'nPREV')" style="margin-bottom:8px;background:#fff;padding:8px">
            <input id="nIMG" type="text" placeholder="OR enter image URL (https://... or images/...)">
            <div style="margin-top:8px">
              <img id="nPREV" src="" style="display:none;width:80px;height:80px;border-radius:10px;object-fit:cover;border:2px solid var(--dk)">
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="asave" onclick="saveNewProduct()">Save Product</button>
            <button class="acanc" style="background:none;border:2px solid #ddd;padding:10px 16px;border-radius:10px;font-weight:800;font-size:13px;color:#888;cursor:pointer" onclick="document.getElementById('ADD_PROD_FORM').style.display='none'">Cancel</button>
          </div>
        </div>

        <div id="EDIT_PROD_FORM" style="display:none" class="ac">
          <div class="act">✏️ Edit Product</div>
          <input type="hidden" id="eID">
          <div class="afg"><label>Product Name *</label><input id="eNM" type="text"></div>
          <div class="afg"><label>Description</label><input id="eDS" type="text"></div>
          <div class="afg"><label>Price (₹) *</label><input id="ePR" type="number"></div>
          <div class="afg">
            <label>Category</label>
            <select id="eCAT">
              <option value="sticker">Sticker</option>
              <option value="poster">Poster</option>
              <option value="polaroid">Polaroid</option>
              <option value="offer">Offer</option>
            </select>
          </div>
          <div class="afg"><label>Badge (HOT / NEW / TREND)</label><input id="eBG" type="text"></div>
          <div class="afg">
            <label>Product Image (Upload File OR Enter URL) *</label>
            <input type="file" id="eFILE" accept="image/*" onchange="handleImageFileSelect(this, 'eIMG', 'ePREV')" style="margin-bottom:8px;background:#fff;padding:8px">
            <input id="eIMG" type="text" placeholder="OR enter image URL">
            <div style="margin-top:8px">
              <img id="ePREV" src="" style="display:none;width:80px;height:80px;border-radius:10px;object-fit:cover;border:2px solid var(--dk)">
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="asave" onclick="saveEditProduct()">Update Product</button>
            <button class="acanc" style="background:none;border:2px solid #ddd;padding:10px 16px;border-radius:10px;font-weight:800;font-size:13px;color:#888;cursor:pointer" onclick="document.getElementById('EDIT_PROD_FORM').style.display='none'">Cancel</button>
          </div>
        </div>

        <div class="ac">
          <div class="act">🏷 Store Catalogue (${STORE_PRODUCTS.length} products)</div>
          ${STORE_PRODUCTS.map(p => `
            <div style="background:#fff;border-radius:12px;border:2px solid #eee;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px">
              <img src="${safeStr(p.img)}" style="width:54px;height:54px;border-radius:10px;object-fit:cover" alt="${safeStr(p.nm)}">
              <div style="flex:1;min-width:0">
                <div style="font-weight:900;font-size:14px">${safeStr(p.nm)}</div>
                <div style="font-family:'Bangers',cursive;font-size:20px;color:var(--pk)">₹${p.pr}</div>
                <div style="font-size:11px;color:#aaa">${safeStr(p.cat)} · ${safeStr(p.bg || 'No badge')}</div>
              </div>
              <button onclick="editProduct('${safeStr(p.id)}')" style="padding:6px 14px;border-radius:10px;border:2px solid var(--bl);color:var(--bl);font-weight:900;font-size:12px;background:#fff;cursor:pointer">✏️ Edit</button>
              <button onclick="delProduct('${safeStr(p.id)}')" style="padding:6px 14px;border-radius:10px;border:2px solid #e53935;color:#e53935;font-weight:900;font-size:12px;background:#fff;cursor:pointer">🗑 Delete</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function handleImageFileSelect(fileInput, targetInputId, previewImgId) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 300;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.65);

          document.getElementById(targetInputId).value = dataUrl;
          const prevEl = document.getElementById(previewImgId);
          if (prevEl) {
            prevEl.src = dataUrl;
            prevEl.style.display = 'block';
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleAddProductForm() {
      const addForm = document.getElementById('ADD_PROD_FORM');
      const editForm = document.getElementById('EDIT_PROD_FORM');
      if (editForm) editForm.style.display = 'none';
      if (!addForm) return;

      const isHidden = addForm.style.display === 'none' || !addForm.style.display;
      if (isHidden) {
        document.getElementById('nNM').value = '';
        document.getElementById('nDS').value = '';
        document.getElementById('nPR').value = '';
        document.getElementById('nCAT').value = 'sticker';
        document.getElementById('nBG').value = '';
        document.getElementById('nIMG').value = '';
        const prev = document.getElementById('nPREV');
        if (prev) { prev.src = ''; prev.style.display = 'none'; }
        addForm.style.display = 'block';
        addForm.scrollIntoView({ behavior: 'smooth' });
      } else {
        addForm.style.display = 'none';
      }
    }

    function editProduct(id) {
      const p = STORE_PRODUCTS.find(x => x.id === id);
      if (!p) return;
      document.getElementById('ADD_PROD_FORM').style.display = 'none';
      const form = document.getElementById('EDIT_PROD_FORM');
      if (!form) return;
      document.getElementById('eID').value = p.id;
      document.getElementById('eNM').value = p.nm || '';
      document.getElementById('eDS').value = p.ds || '';
      document.getElementById('ePR').value = p.pr || 0;
      document.getElementById('eCAT').value = p.cat || 'sticker';
      document.getElementById('eBG').value = p.bg || '';
      document.getElementById('eIMG').value = p.img || '';

      const prevEl = document.getElementById('ePREV');
      if (prevEl && p.img) {
        prevEl.src = p.img;
        prevEl.style.display = 'block';
      } else if (prevEl) {
        prevEl.style.display = 'none';
      }

      form.style.display = 'block';
      form.scrollIntoView({ behavior: 'smooth' });
    }

    async function saveEditProduct() {
      const id = document.getElementById('eID').value;
      const p = STORE_PRODUCTS.find(x => x.id === id);
      if (!p) return;

      const nm = document.getElementById('eNM').value.trim();
      const pr = parseInt(document.getElementById('ePR').value) || 0;
      if (!nm || !pr) {
        showToast('⚠️ Product Name and Price required!');
        return;
      }

      p.nm = nm;
      p.ds = document.getElementById('eDS').value.trim();
      p.pr = pr;
      p.cat = document.getElementById('eCAT').value;
      p.bg = document.getElementById('eBG').value.trim();
      p.bt = (p.bg || '').toLowerCase();
      p.img = document.getElementById('eIMG').value.trim() || p.img;

      try {
        await sbPatch('sv_products', 'id=eq.' + encodeURIComponent(id), {
          nm: p.nm, ds: p.ds, pr: p.pr, cat: p.cat, bg: p.bg, bt: p.bt, img: p.img
        });
      } catch (e) { console.error(e); }

      try {
        localStorage.setItem('sp_local_products', JSON.stringify(STORE_PRODUCTS));
        localStorage.setItem('sv_local_products', JSON.stringify(STORE_PRODUCTS));
      } catch(e) { console.warn('LocalStorage limit full:', e); }
      window.STORE_PRODUCTS = STORE_PRODUCTS;
      document.getElementById('EDIT_PROD_FORM').style.display = 'none';
      rProds();
      showToast('✅ Product Updated!');
    }

    async function saveNewProduct() {
      const nmEl = document.getElementById('nNM');
      const prEl = document.getElementById('nPR');
      if (!nmEl || !prEl) return;

      const nm = nmEl.value.trim();
      const pr = parseInt(prEl.value) || 0;
      if (!nm || !pr) {
        alert('⚠️ Please enter Product Name and Price!');
        showToast('⚠️ Product Name and Price required!');
        return;
      }

      const p = {
        id: 'p_' + Date.now(),
        nm: nm,
        ds: (document.getElementById('nDS')?.value || '').trim() || 'Vinyl Sticker',
        pr: pr,
        cat: document.getElementById('nCAT')?.value || 'sticker',
        bg: (document.getElementById('nBG')?.value || '').trim(),
        bt: ((document.getElementById('nBG')?.value || '').trim()).toLowerCase(),
        on_sale: true,
        img: (document.getElementById('nIMG')?.value || '').trim() || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&auto=format&fit=crop&q=80'
      };

      STORE_PRODUCTS.unshift(p);
      try {
        localStorage.setItem('sp_local_products', JSON.stringify(STORE_PRODUCTS));
        localStorage.setItem('sv_local_products', JSON.stringify(STORE_PRODUCTS));
      } catch(e) { console.warn('LocalStorage limit full:', e); }
      window.STORE_PRODUCTS = STORE_PRODUCTS;

      try {
        await sbPost('sv_products', p);
      } catch (e) {
        console.warn('DB save warning, saved locally:', e);
      }

      const form = document.getElementById('ADD_PROD_FORM');
      if (form) form.style.display = 'none';
      rProds();
      showToast('✅ Product Added Successfully!');
    }

    async function delProduct(id) {
      if (!confirm('Delete this product?')) return;
      STORE_PRODUCTS = STORE_PRODUCTS.filter(p => p.id !== id);
      try {
        localStorage.setItem('sp_local_products', JSON.stringify(STORE_PRODUCTS));
        localStorage.setItem('sv_local_products', JSON.stringify(STORE_PRODUCTS));
      } catch(e) { console.warn('LocalStorage limit full:', e); }
      window.STORE_PRODUCTS = STORE_PRODUCTS;

      try {
        await sbDelete('sv_products', 'id=eq.' + encodeURIComponent(id));
      } catch (e) { console.error(e); }
      rProds();
      showToast('🗑 Product deleted');
    }

    function rHero() {
      document.getElementById('T_hero').innerHTML = `
        <div class="ac">
          <div class="act">🖼 Hero Banners & Slideshow (${STORE_BANNERS.length} Banners)</div>
          ${STORE_BANNERS.map((b, idx) => `
            <div style="background:#f9f9ff;border-radius:12px;padding:16px;margin-bottom:14px;border:2px solid #eee">
              <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
                <img src="${safeStr(b.img)}" style="width:90px;height:60px;border-radius:10px;object-fit:cover;border:2px solid var(--dk)">
                <div style="flex:1">
                  <div style="font-weight:900;font-size:15px">${safeStr(b.title)}</div>
                  <div style="font-size:12px;color:#888">${safeStr(b.sub)}</div>
                  <div style="font-size:11px;color:var(--pk);font-weight:800;margin-top:4px">Badge: ${safeStr(b.badge || 'None')} · CTA: ${safeStr(b.cta || 'Shop Now')} (${safeStr(b.cta_link || 'shop.html')})</div>
                </div>
              </div>
              
              <div style="background:#fff;border-radius:10px;padding:12px;border:1px solid #ddd">
                <div style="font-weight:800;font-size:12px;margin-bottom:8px;color:var(--dk)">✏️ Edit Banner #${idx + 1}</div>
                <div class="afg"><label>Banner Title</label><input id="bTITLE_${b.id || idx}" value="${safeStr(b.title)}"></div>
                <div class="afg"><label>Subtitle</label><input id="bSUB_${b.id || idx}" value="${safeStr(b.sub)}"></div>
                <div class="afg"><label>Badge Text</label><input id="bBADGE_${b.id || idx}" value="${safeStr(b.badge)}"></div>
                <div class="afg">
                  <label>Image (Upload File OR Enter URL)</label>
                  <input type="file" accept="image/*" onchange="handleImageFileSelect(this, 'bIMG_${b.id || idx}', 'bPREV_${b.id || idx}')" style="margin-bottom:6px;background:#f8f8f8;padding:6px">
                  <input id="bIMG_${b.id || idx}" value="${safeStr(b.img)}">
                  <div style="margin-top:6px">
                    <img id="bPREV_${b.id || idx}" src="${safeStr(b.img)}" style="width:80px;height:50px;border-radius:8px;object-fit:cover;border:1px solid var(--dk)">
                  </div>
                </div>
                <div class="afg"><label>Button Text (CTA)</label><input id="bCTA_${b.id || idx}" value="${safeStr(b.cta)}"></div>
                <div class="afg"><label>Button Link (URL)</label><input id="bLINK_${b.id || idx}" value="${safeStr(b.cta_link)}"></div>
                <button class="asave" onclick="saveBannerDB('${b.id || ('b' + (idx+1))}', ${idx})">Save Banner to Database</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function saveBannerDB(bId, idx) {
      const banner = STORE_BANNERS[idx];
      if (!banner) return;

      banner.title = document.getElementById('bTITLE_' + (bId || idx)).value.trim();
      banner.sub = document.getElementById('bSUB_' + (bId || idx)).value.trim();
      banner.badge = document.getElementById('bBADGE_' + (bId || idx)).value.trim();
      banner.img = document.getElementById('bIMG_' + (bId || idx)).value.trim();
      banner.cta = document.getElementById('bCTA_' + (bId || idx)).value.trim();
      banner.cta_link = document.getElementById('bLINK_' + (bId || idx)).value.trim();

      localStorage.setItem('sv_local_banners', JSON.stringify(STORE_BANNERS));
      window.STORE_BANNERS = STORE_BANNERS;

      try {
        await sbPatch('sv_banners', 'id=eq.' + encodeURIComponent(bId), {
          title: banner.title,
          sub: banner.sub,
          badge: banner.badge,
          img: banner.img,
          cta: banner.cta,
          cta_link: banner.cta_link
        });
      } catch (e) { console.error('Banner save error:', e); }

      rHero();
      showToast('✅ Banner Saved to Supabase Database!');
    }

    function rSets() {
      document.getElementById('T_sets').innerHTML = `
        <div class="ac">
          <div class="act">⚙️ General Store Settings</div>
          <div class="afg"><label>Store Name</label><input id="sNM" value="${safeStr(STORE_CONFIG.nm)}"></div>
          <div class="afg"><label>WhatsApp Number (with Country Code e.g. 919566743599)</label><input id="sWA" value="${safeStr(STORE_CONFIG.wa)}"></div>
          <div class="afg"><label>Minimum Order Value (₹)</label><input id="sMIN" type="number" value="${STORE_CONFIG.min_order}"></div>
          <div class="afg"><label>Announcement Marquee Text (Use | to separate items)</label><input id="sANN" value="${safeStr(STORE_CONFIG.ann)}"></div>
        </div>

        <div class="ac">
          <div class="act">⚡ Launch Offer Deal Settings</div>
          <div class="afg"><label>Launch Offer Bundle Title</label><input id="sOFTITLE" value="${safeStr(STORE_CONFIG.of_title || '7 A5 POSTERS BUNDLE')}"></div>
          <div class="afg"><label>Launch Offer Price (₹)</label><input id="sOFP" type="number" value="${STORE_CONFIG.ofp || 149}"></div>
          <div class="afg"><label>Original Price (₹)</label><input id="sOFORIG" type="number" value="${STORE_CONFIG.of_orig || 203}"></div>
        </div>

        <div class="ac">
          <div class="act">💳 Payment Gateway Credentials</div>
          <div class="afg"><label>Razorpay Key ID (rzp_live_... / rzp_test_...)</label><input id="sRZP" value="${safeStr(STORE_CONFIG.rzp_key)}"></div>
          <button class="asave" onclick="saveStoreSets()">Save Store Settings</button>
        </div>

        <div class="ac">
          <div class="act">🔐 Change Admin Password</div>
          <div class="afg"><label>New Password</label><input id="sNP" type="password" placeholder="New Password"></div>
          <button class="asave" onclick="updateAdminPwd()">Update Password</button>

    async function saveStoreSets() {
      STORE_CONFIG.nm = document.getElementById('sNM').value.trim();
      STORE_CONFIG.wa = document.getElementById('sWA').value.trim();
      STORE_CONFIG.min_order = parseInt(document.getElementById('sMIN').value) || 199;
      STORE_CONFIG.ann = document.getElementById('sANN').value.trim();

      STORE_CONFIG.of_title = document.getElementById('sOFTITLE').value.trim();
      STORE_CONFIG.ofp = parseInt(document.getElementById('sOFP').value) || 149;
      STORE_CONFIG.of_orig = parseInt(document.getElementById('sOFORIG').value) || 203;
      STORE_CONFIG.rzp_key = document.getElementById('sRZP').value.trim();

      localStorage.setItem('sp_local_config', JSON.stringify(STORE_CONFIG));
      localStorage.setItem('sv_local_config', JSON.stringify(STORE_CONFIG));
      window.STORE_CONFIG = STORE_CONFIG;

      if (typeof window.applyStoreConfigData === 'function') window.applyStoreConfigData();

      try {
        await sbPatch('sv_config', 'id=eq.1', {
          nm: STORE_CONFIG.nm,
          wa: STORE_CONFIG.wa,
          min_order: STORE_CONFIG.min_order,
          ann: STORE_CONFIG.ann,
          of_title: STORE_CONFIG.of_title,
          ofp: STORE_CONFIG.ofp,
          of_orig: STORE_CONFIG.of_orig,
          rzp_key: STORE_CONFIG.rzp_key,
          updated_at: new Date().toISOString()
        });
      } catch(e) { console.error('Save config error:', e); }
      showToast('✅ All Settings Saved to Database!');
    }

    function updateAdminPwd() {
      const np = document.getElementById('sNP').value;
      if (!np) return;
      localStorage.setItem('sp_pwd', np);
      localStorage.setItem('sv_pwd', np);
      showToast('✅ Password Updated!');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initStoreData();
      checkAdminAuth();
    });
  </script>
